name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-boundary:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject obsolete gateway references in active source
        shell: bash
        run: |
          set -euo pipefail
          pattern='oaifree|fuclaude|pandora\.domain|proxy-pass\.(oaifree|fuclaude)'
          if git grep -n -i -E "$pattern" -- cmd internal pkg frontend/src data; then
            echo "Legacy gateway reference found in active source."
            exit 1
          fi
      - name: Keep ChatGPT Web endpoints inside provider implementations
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '/backend-api/' -- cmd internal/handler internal/service internal/repository pkg frontend/src data; then
            echo "ChatGPT Web endpoint leaked outside internal/provider/chatgpt."
            exit 1
          fi
      - name: Keep account model secret-free on JSON output
        shell: bash
        run: |
          set -euo pipefail
          pattern='json:"(password|sessionToken|accessToken|refreshToken|sessionKey|proxyUrl)"'
          if git grep -n -E "$pattern" -- internal/model/account.go; then
            echo "Sensitive Account field became JSON-serializable. Use an explicit write DTO and redacted read model."
            exit 1
          fi
      - name: Reject production-shaped credentials in fixtures
        shell: bash
        run: |
          set -euo pipefail
          pattern='sk-(proj-)?[A-Za-z0-9_-]{40,}|__Secure-next-auth\.session-token=[^[:space:]";]{60,}|Bearer[[:space:]]+[A-Za-z0-9._~+/-]{80,}'
          if git grep -n -E "$pattern" -- test data; then
            echo "Production-shaped credential found in a test fixture or checked-in data file. Use short synthetic values."
            exit 1
          fi
      - name: Reject wholesale HTTP client response logging
        shell: bash
        run: |
          set -euo pipefail
          pattern='zap\.Any\("[^"]+",[[:space:]]*(res|resp|response)\)'
          if git grep -n -E "$pattern" -- internal; then
            echo "Potential secret-bearing HTTP response is logged wholesale. Log status/typed metadata only."
            exit 1
          fi
      - name: Keep conversation persistence metadata-only
        shell: bash
        run: |
          set -euo pipefail
          pattern='^[[:space:]]*(UserMessage|AssistantMessage|Prompt|Content)[[:space:]]+'
          if grep -n -E "$pattern" internal/model/conversation.go; then
            echo "Conversation content must remain upstream-owned; local persistence may store metadata only."
            exit 1
          fi

  backend:
    name: Go build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./test/server/...
      - name: Build server
        run: go build -ldflags='-s -w' -o /tmp/PandoraHelper ./cmd/server
      - name: Build web mirror probe
        run: go build -ldflags='-s -w' -o /tmp/webmirror-probe ./cmd/webmirror-probe

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  smoke:
    name: Fresh SQLite startup smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true
      - name: Build server
        run: go build -ldflags='-s -w' -o /tmp/PandoraHelper ./cmd/server
      - name: Start from a fresh data directory without legacy upstreams
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/data"
          jq '
            .security.admin_password = "ci-baseline-password" |
            .http.host = "127.0.0.1" |
            .http.port = 19000 |
            .account.refresh.enabled = false |
            .share.refresh.enabled = false |
            .database.dsn = "./data/data.db"
          ' data/config.json > "$workdir/data/config.json"

          (
            cd "$workdir"
            /tmp/PandoraHelper -conf "$workdir/data/" >server.log 2>&1 &
            echo $! >server.pid
          )

          pid="$(cat "$workdir/server.pid")"
          trap 'kill "$pid" 2>/dev/null || true; cat "$workdir/server.log" || true' EXIT

          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:19000/health | grep -q 'healthy'; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent http://127.0.0.1:19000/health | grep -q 'healthy'
          curl --fail --silent http://127.0.0.1:19000/readiness | grep -q 'ready'
          test -f "$workdir/data/data.db"
          ! grep -Eqi 'oaifree|fuclaude' "$workdir/server.log"

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true
      - name: Build Linux binaries expected by upstream Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/PandoraHelper-ci-linux-amd64
          mkdir -p builds/PandoraHelper-ci-linux-arm64
          GOOS=linux GOARCH=amd64 go build -ldflags='-s -w' -o builds/PandoraHelper-ci-linux-amd64/PandoraHelper ./cmd/server
          GOOS=linux GOARCH=arm64 go build -ldflags='-s -w' -o builds/PandoraHelper-ci-linux-arm64/PandoraHelper ./cmd/server
      - name: Build Docker image
        run: docker build -f deploy/build/Dockerfile --build-arg VERSION=ci --build-arg TARGETPLATFORM=linux/amd64 -t gpt-mirror:ci .
