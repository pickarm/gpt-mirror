name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-boundary:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell release tooling
        run: bash -n scripts/rc-live-check.sh browser-worker/entrypoint.sh deploy/docker-entrypoint.sh
      - name: Reject obsolete gateway references in active source
        shell: bash
        run: |
          set -euo pipefail
          pattern='oaifree|fuclaude|pandora\.domain|proxy-pass\.(oaifree|fuclaude)'
          if git grep -n -i -E "$pattern" -- cmd internal pkg frontend/src data; then
            echo "Legacy gateway reference found in active source."
            exit 1
          fi
      - name: Keep ChatGPT Web endpoints inside provider implementations
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '/backend-api/' -- cmd internal/handler internal/service internal/repository pkg frontend/src data; then
            echo "ChatGPT Web endpoint leaked outside internal/provider/chatgpt."
            exit 1
          fi
      - name: Keep account model secret-free on JSON output
        shell: bash
        run: |
          set -euo pipefail
          pattern='json:"(password|sessionToken|accessToken|refreshToken|sessionKey|proxyUrl|cookie)"'
          if git grep -n -E "$pattern" -- internal/model/account.go; then
            echo "Sensitive Account field became JSON-serializable. Use an explicit write DTO and redacted read model."
            exit 1
          fi
      - name: Reject production-shaped credentials in fixtures
        shell: bash
        run: |
          set -euo pipefail
          pattern='sk-(proj-)?[A-Za-z0-9_-]{40,}|__Secure-next-auth\.session-token=[^[:space:]";]{60,}|Bearer[[:space:]]+[A-Za-z0-9._~+/-]{80,}'
          if git grep -n -E "$pattern" -- test data; then
            echo "Production-shaped credential found in a test fixture or checked-in data file. Use short synthetic values."
            exit 1
          fi
      - name: Reject wholesale HTTP client response logging
        shell: bash
        run: |
          set -euo pipefail
          pattern='zap\.Any\("[^"]+",[[:space:]]*(res|resp|response)\)'
          if git grep -n -E "$pattern" -- internal; then
            echo "Potential secret-bearing HTTP response is logged wholesale. Log status/typed metadata only."
            exit 1
          fi
      - name: Keep conversation persistence metadata-only
        shell: bash
        run: |
          set -euo pipefail
          pattern='^[[:space:]]*(UserMessage|AssistantMessage|Prompt|Content)[[:space:]]+'
          if grep -n -E "$pattern" internal/model/conversation.go; then
            echo "Conversation content must remain upstream-owned; local persistence may store metadata only."
            exit 1
          fi

  backend:
    name: Go build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run full Go test suite
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee /tmp/go-test.log
      - name: Upload Go test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-log-${{ github.run_id }}
          path: /tmp/go-test.log
          retention-days: 1
      - name: Build server
        run: go build -trimpath -ldflags='-s -w' -o /tmp/gpt-mirror ./cmd/server
      - name: Build web mirror probe
        run: go build -trimpath -ldflags='-s -w' -o /tmp/webmirror-probe ./cmd/webmirror-probe

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  smoke:
    name: Fresh SQLite startup smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache: true
      - name: Build server
        run: go build -trimpath -ldflags='-s -w' -o /tmp/gpt-mirror ./cmd/server
      - name: Start from a fresh data directory without legacy upstreams
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/data"
          jq '
            .security.admin_password = "ci-baseline-password" |
            .http.host = "127.0.0.1" |
            .http.port = 19000 |
            .account.refresh.enabled = false |
            .share.refresh.enabled = false |
            .database.dsn = "./data/data.db"
          ' data/config.json > "$workdir/data/config.json"

          (
            cd "$workdir"
            /tmp/gpt-mirror -conf "$workdir/data/" >server.log 2>&1 &
            echo $! >server.pid
          )

          pid="$(cat "$workdir/server.pid")"
          trap 'kill "$pid" 2>/dev/null || true; cat "$workdir/server.log" || true' EXIT

          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:19000/health | grep -q 'healthy'; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent http://127.0.0.1:19000/health | grep -q 'healthy'
          curl --fail --silent http://127.0.0.1:19000/readiness | grep -q 'ready'
          test -f "$workdir/data/data.db"
          ! grep -Eqi 'oaifree|fuclaude' "$workdir/server.log"

  docker:
    name: Release Docker Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare release Compose environment
        shell: bash
        run: |
          cat >/tmp/gpt-mirror-ci.env <<'EOF'
          ADMIN_PASSWORD=ci-release-password
          SECURITY_CREDENTIAL_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GPT_MIRROR_PORT=19001
          TRANSPORT_PROXY_URL=
          EOF
      - name: Validate canonical root Compose configuration
        run: docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml config >/tmp/compose.yml
      - name: Start canonical release deployment
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml ps -a || true
            docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml logs --no-color || true
            docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml up -d --build

          wait_app() {
            for _ in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:19001/readiness | grep -q 'ready'; then
                return 0
              fi
              sleep 0.5
            done
            return 1
          }
          wait_worker() {
            for _ in $(seq 1 60); do
              if docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml exec -T browser-worker node -e "const http=require('http');const r=http.get({socketPath:'/run/gpt-mirror/browser.sock',path:'/health'},x=>process.exit(x.statusCode===200?0:1));r.on('error',()=>process.exit(1));"; then
                return 0
              fi
              sleep 0.5
            done
            return 1
          }

          wait_worker
          wait_app
          curl --fail --silent http://127.0.0.1:19001/health | grep -q 'healthy'
          docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml exec -T gpt-mirror test -f /app/data/config.json
          docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml exec -T gpt-mirror test -f /app/data/data.db

          # RC regression: both containers must recover through their normal
          # entrypoints and the named data volume must survive process restart.
          docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml restart browser-worker
          wait_worker
          docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml restart gpt-mirror
          wait_app
          docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml exec -T gpt-mirror test -f /app/data/config.json
          docker compose --env-file /tmp/gpt-mirror-ci.env -f compose.yaml exec -T gpt-mirror test -f /app/data/data.db
