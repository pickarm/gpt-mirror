name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./test/server/...
      - name: Build server
        run: go build -ldflags='-s -w' -o /tmp/PandoraHelper ./cmd/server

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  smoke:
    name: Fresh SQLite startup smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
          cache: true
      - name: Build server
        run: go build -ldflags='-s -w' -o /tmp/PandoraHelper ./cmd/server
      - name: Start from a fresh data directory
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/data"
          jq '
            .security.admin_password = "ci-baseline-password" |
            .http.host = "127.0.0.1" |
            .http.port = 19000 |
            .http["proxy-pass"].oaifree.enable = false |
            .http["proxy-pass"].fuclaude.enable = false |
            .pandora.domain.index = "http://127.0.0.1:9" |
            .pandora.domain.claude = "http://127.0.0.1:9" |
            .database.dsn = "./data/data.db"
          ' data/config.json > "$workdir/data/config.json"

          (
            cd "$workdir"
            /tmp/PandoraHelper -conf "$workdir/data/" >server.log 2>&1 &
            echo $! >server.pid
          )

          pid="$(cat "$workdir/server.pid")"
          trap 'kill "$pid" 2>/dev/null || true; cat "$workdir/server.log" || true' EXIT

          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:19000/health | grep -q 'healthy'; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent http://127.0.0.1:19000/health | grep -q 'healthy'
          curl --fail --silent http://127.0.0.1:19000/readiness | grep -q 'ready'
          test -f "$workdir/data/data.db"

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
          cache: true
      - name: Build Linux binaries expected by upstream Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/PandoraHelper-ci-linux-amd64
          mkdir -p builds/PandoraHelper-ci-linux-arm64
          GOOS=linux GOARCH=amd64 go build -ldflags='-s -w' -o builds/PandoraHelper-ci-linux-amd64/PandoraHelper ./cmd/server
          GOOS=linux GOARCH=arm64 go build -ldflags='-s -w' -o builds/PandoraHelper-ci-linux-arm64/PandoraHelper ./cmd/server
      - name: Build Docker image
        run: docker build -f deploy/build/Dockerfile --build-arg VERSION=ci --build-arg TARGETPLATFORM=linux/amd64 -t gpt-mirror:ci .
