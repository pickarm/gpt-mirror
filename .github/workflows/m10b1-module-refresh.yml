name: M10B1 module refresh

on:
  push:
    branches:
      - m10b1/gin-1.12

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: m10b1/gin-1.12
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh Gin dependency
        run: |
          go get github.com/gin-gonic/gin@v1.12.0
          go mod verify
          go test ./...
      - name: Commit module metadata when changed
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "Module metadata already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "deps: upgrade Gin to 1.12.0"
          git push origin HEAD:m10b1/gin-1.12
