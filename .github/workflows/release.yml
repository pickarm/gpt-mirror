name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify tagged release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require release tag to point at main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit contained in main."
            exit 1
          }
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache: true
      - name: Run full Go test suite
        run: go test ./...
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Validate source and registry Compose entrypoints
        shell: bash
        run: |
          cat >/tmp/gpt-mirror-release.env <<'EOF'
          ADMIN_PASSWORD=release-validation-password
          SECURITY_CREDENTIAL_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GPT_MIRROR_PORT=19001
          CHATGPT_BROWSER_ENABLED=true
          GPT_MIRROR_VERSION=1.0.0-test
          TRANSPORT_PROXY_URL=
          EOF
          docker compose --env-file /tmp/gpt-mirror-release.env -f compose.yaml config >/dev/null
          docker compose --env-file /tmp/gpt-mirror-release.env -f compose.registry.yaml config >/dev/null

  publish-images:
    name: Publish GHCR images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate server image metadata
        id: server-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Generate browser worker image metadata
        id: browser-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-browser
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push browser worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./browser-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.browser-meta.outputs.tags }}
          labels: ${{ steps.browser-meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  published-stack-smoke:
    name: Smoke published GHCR stack
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and start matching published images
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cat >/tmp/gpt-mirror-published.env <<EOF
          ADMIN_PASSWORD=release-validation-password
          SECURITY_CREDENTIAL_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GPT_MIRROR_PORT=19002
          CHATGPT_BROWSER_ENABLED=true
          GPT_MIRROR_VERSION=$version
          TRANSPORT_PROXY_URL=
          EOF

          cleanup() {
            docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml ps -a || true
            docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml logs --no-color || true
            docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml pull
          docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml up -d

          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:19002/readiness | grep -q 'ready'; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent http://127.0.0.1:19002/health | grep -q 'healthy'
          curl --fail --silent http://127.0.0.1:19002/readiness | grep -q 'ready'
          docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml exec -T browser-worker node -e "const http=require('http');const r=http.get({socketPath:'/run/gpt-mirror/browser.sock',path:'/health'},x=>process.exit(x.statusCode===200?0:1));r.on('error',()=>process.exit(1));"
          docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml exec -T gpt-mirror test -f /app/data/config.json
          docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml exec -T gpt-mirror test -f /app/data/data.db

  github-release:
    name: Publish GitHub Release
    needs: published-stack-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "GPT Mirror $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
