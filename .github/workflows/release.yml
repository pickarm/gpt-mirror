name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-trigger/v*'

permissions:
  contents: write
  packages: write

jobs:
  context:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      major_minor: ${{ steps.release.outputs.major_minor }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Resolve and validate version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release-trigger/v* ]]; then
            tag="${GITHUB_REF#refs/heads/release-trigger/}"
          else
            echo "Unsupported release ref: $GITHUB_REF"
            exit 1
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi

          version="${tag#v}"
          core="${version%%-*}"
          IFS='.' read -r major minor patch <<<"$core"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major.$minor" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release commit
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require release commit to be contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit must already be contained in main."
            exit 1
          }
          version="${{ needs.context.outputs.version }}"
          grep -Fq "## [$version]" CHANGELOG.md || {
            echo "CHANGELOG.md does not contain release $version."
            exit 1
          }
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache: true
      - name: Run full Go test suite
        run: go test ./...
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Validate source and registry Compose entrypoints
        shell: bash
        run: |
          cat >/tmp/gpt-mirror-release.env <<EOF
          ADMIN_PASSWORD=release-validation-password
          SECURITY_CREDENTIAL_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GPT_MIRROR_PORT=19001
          CHATGPT_BROWSER_ENABLED=true
          GPT_MIRROR_VERSION=${{ needs.context.outputs.version }}
          TRANSPORT_PROXY_URL=
          EOF
          docker compose --env-file /tmp/gpt-mirror-release.env -f compose.yaml config >/dev/null
          docker compose --env-file /tmp/gpt-mirror-release.env -f compose.registry.yaml config >/dev/null

  publish-server:
    name: Publish server GHCR image
    needs: [context, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate server image metadata
        id: server-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.context.outputs.version }}
            type=raw,value=${{ needs.context.outputs.major_minor }},enable=${{ needs.context.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.context.outputs.major }},enable=${{ needs.context.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.context.outputs.prerelease == 'false' }}
      - name: Build and push server image (attempt 1)
        id: server_build_primary
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Back off before server image retry
        if: ${{ steps.server_build_primary.outcome == 'failure' }}
        run: sleep 20
      - name: Build and push server image (retry)
        if: ${{ steps.server_build_primary.outcome == 'failure' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  publish-browser:
    name: Publish browser-worker GHCR image
    needs: [context, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate browser worker image metadata
        id: browser-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-browser
          tags: |
            type=raw,value=${{ needs.context.outputs.version }}
            type=raw,value=${{ needs.context.outputs.major_minor }},enable=${{ needs.context.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.context.outputs.major }},enable=${{ needs.context.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.context.outputs.prerelease == 'false' }}
      - name: Build and push browser worker image (attempt 1)
        id: browser_build_primary
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./browser-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.browser-meta.outputs.tags }}
          labels: ${{ steps.browser-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Back off before browser-worker image retry
        if: ${{ steps.browser_build_primary.outcome == 'failure' }}
        run: sleep 20
      - name: Build and push browser worker image (retry)
        if: ${{ steps.browser_build_primary.outcome == 'failure' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./browser-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.browser-meta.outputs.tags }}
          labels: ${{ steps.browser-meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  published-stack-smoke:
    name: Smoke published GHCR stack
    needs: [context, publish-server, publish-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and start matching published images
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/gpt-mirror-published.env <<EOF
          ADMIN_PASSWORD=release-validation-password
          SECURITY_CREDENTIAL_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GPT_MIRROR_PORT=19002
          CHATGPT_BROWSER_ENABLED=true
          GPT_MIRROR_VERSION=${{ needs.context.outputs.version }}
          TRANSPORT_PROXY_URL=
          EOF

          cleanup() {
            docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml ps -a || true
            docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml logs --no-color || true
            docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml pull
          docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml up -d

          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:19002/readiness | grep -q 'ready'; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent http://127.0.0.1:19002/health | grep -q 'healthy'
          curl --fail --silent http://127.0.0.1:19002/readiness | grep -q 'ready'
          docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml exec -T browser-worker node -e "const http=require('http');const r=http.get({socketPath:'/run/gpt-mirror/browser.sock',path:'/health'},x=>process.exit(x.statusCode===200?0:1));r.on('error',()=>process.exit(1));"
          docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml exec -T gpt-mirror test -f /app/data/config.json
          docker compose --env-file /tmp/gpt-mirror-published.env -f compose.registry.yaml exec -T gpt-mirror test -f /app/data/data.db

  github-release:
    name: Publish GitHub Release
    needs: [context, published-stack-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release and clean trigger branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.context.outputs.tag }}"
          prerelease=()
          target=()
          if [[ "${{ needs.context.outputs.prerelease }}" == "true" ]]; then
            prerelease+=(--prerelease)
          fi
          if [[ "$GITHUB_REF" == refs/heads/release-trigger/* ]]; then
            target+=(--target "$GITHUB_SHA")
          fi

          gh release create "$tag" \
            --title "GPT Mirror $tag" \
            --generate-notes \
            "${prerelease[@]}" \
            "${target[@]}"

          if [[ "$GITHUB_REF" == refs/heads/release-trigger/* ]]; then
            git push origin --delete "$GITHUB_REF_NAME" || true
          fi
