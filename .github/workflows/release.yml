name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify tagged release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require release tag to point at main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit contained in main."
            exit 1
          }
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache: true
      - name: Run full Go test suite
        run: go test ./...
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Validate root Compose release entrypoint
        shell: bash
        run: |
          cat >/tmp/gpt-mirror-release.env <<'EOF'
          ADMIN_PASSWORD=release-validation-password
          SECURITY_CREDENTIAL_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GPT_MIRROR_PORT=19001
          TRANSPORT_PROXY_URL=
          EOF
          docker compose --env-file /tmp/gpt-mirror-release.env -f compose.yaml config >/dev/null

  publish-image:
    name: Publish GHCR image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  github-release:
    name: Publish GitHub Release
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "GPT Mirror $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
