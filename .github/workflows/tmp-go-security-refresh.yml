name: Temporary Go security dependency refresh

on:
  push:
    branches:
      - modernize/go-security-foundations

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/go-security-foundations
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true
      - name: Refresh security foundation modules
        shell: bash
        run: |
          set -euo pipefail
          go get golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0
          git diff --check
      - name: Commit generated module files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          if git diff --cached --quiet; then
            echo 'No module changes generated.'
            exit 0
          fi
          git commit -m 'deps: refresh Go security module graph'
          git push origin HEAD:modernize/go-security-foundations
